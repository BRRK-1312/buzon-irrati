name: Actualizar Buzón

on:
  workflow_dispatch:
    inputs:
      dias:
        description: 'Días hacia atrás a incluir'
        required: false
        default: '7'
  schedule:
    # Dos refrescos diarios, con los datos listos hacia las 8:00 y las 18:00
    # (hora peninsular de verano; en invierno, una hora antes). Arrancan a las
    # :37 porque GitHub retrasa mucho las tareas programadas a en punto.
    - cron: '37 5 * * *'
    - cron: '37 15 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar informe
        run: python scripts/scrape.py ${{ github.event.inputs.dias || '7' }}

      - name: Guardar histórico en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898338+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Histórico $(date -u +%F)"
          git pull --rebase
          git push

      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
