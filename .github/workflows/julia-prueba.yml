name: Probar Julia

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Caché del modelo
        uses: actions/cache@v4
        with:
          path: Julia-1
          key: julia-1-v1

      - name: Instalar Julia 1 (CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install huggingface_hub
          python -c "from huggingface_hub import snapshot_download; snapshot_download('SupersonicLabs/Julia-1', local_dir='Julia-1')"
          pip install -e ./Julia-1

      - name: Clasificar la última semana
        run: python scripts/julia_prueba.py Julia-1

      - name: Guardar informe en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898338+github-actions[bot]@users.noreply.github.com"
          git add informes
          git diff --cached --quiet || git commit -m "Informe de prueba de Julia $(date -u +%F)"
          git pull --rebase
          git push
